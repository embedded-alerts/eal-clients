[package]
org = "embedded-alerts"
name = "eal-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Embedded Alerts"
license = "MIT"
language = "polyglot"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-clients"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "bash scripts/test.sh"
