[package]
org = "embedded-alerts"
name = "eal-validation-consumer"
version = "0.1.0"
description = "Client adapters for eal-lib-core public validation SDKs"
license = "MIT"

[dependencies]
"embedded-alerts/eal-lib-core" = "^0.1.0"
"embedded-alerts/eal-interfaces" = "^0.1.0"

[targets.typescript]
dir = "typescript"
adapter = "node"

[targets.rust]
dir = "rust"
adapter = "rust"

[targets.golang]
dir = "golang"
adapter = "none"

[targets.gleam]
dir = "gleam"
adapter = "none"
